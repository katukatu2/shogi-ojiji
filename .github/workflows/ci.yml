name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run release:artifacts
      - run: npm test
      # E2E（Chromium・WebKit）とビルド済み PWA のオフライン起動
      - run: npx playwright install --with-deps chromium webkit
      - id: e2e
        run: npm run e2e
      - id: pwa
        run: npm run e2e:pwa
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-report
          path: logs/e2e/report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.pwa.outcome == 'failure' }}
        with:
          name: pwa-report
          path: logs/pwa/report
          retention-days: 7
      # 台詞の点検: 各戦法 2 局ずつ自動対局してエラーが出ないことだけ確かめる
      - id: selfplay
        run: |
          for s in yagura shikenbisha kakugawari bougin nakabisha; do
            npx vite-node scripts/selfplay.ts -- --style $s --games 2 --plies 60 --out logs/ci-$s.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.selfplay.outcome != 'skipped' }}
        with:
          name: selfplay-logs
          path: logs/ci-*.jsonl
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
