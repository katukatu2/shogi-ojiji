<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b3a55" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./app-icons/apple-touch-icon-180.png" />
    <title>将棋オジジの定石指南</title>
    <meta name="description" content="オジジは毎回、得意戦法で囲ってくる。やってはいけない手を指すと叱られ、正しい手を教わる。序盤を体で覚える将棋。" />
    <!-- LINE・X などでリンクを共有したときの表示（OGP）。説明文は docs/store/listing.md の短い説明と同じ。
         画像は npm run assets:ogp で作る。共有先は相対 URL を解決しないので、URL は絶対で書く -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="将棋オジジの定石指南" />
    <meta property="og:title" content="将棋オジジの定石指南" />
    <meta property="og:description" content="オジジは毎回、得意戦法で囲ってくる。やってはいけない手を指すと叱られ、正しい手を教わる。序盤を体で覚える将棋。" />
    <meta property="og:url" content="https://shogi.godo-amity.com/" />
    <meta property="og:image" content="https://shogi.godo-amity.com/ogp.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="将棋オジジの定石指南。悪い手には「ばかもーん！」。着物姿のオジジの絵" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./src/style.css" />
    <!-- COOP/COEP ヘッダーを付けられない環境向け（静的ホスティング、Capacitor） -->
    <script src="./coi-serviceworker.js"></script>
    <!-- やねうら王 WebAssembly 版（GPLv3）。global に YaneuraOu_K_P を置く -->
    <script src="./engine/yaneuraou.k-p.js"></script>
    <!-- オジジ（雷蔵）のパーツアニメーション。assets.js → raizo-rig.js の順 -->
    <script src="./raizo/assets.js"></script>
    <script src="./raizo/raizo-rig.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
